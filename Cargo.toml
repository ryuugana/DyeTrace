[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/platform-win", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The palette detector scores ~120k candidates per window grab, which is only
# usable when optimised; keep dev builds fast enough to test with.
[profile.dev]
opt-level = 2
